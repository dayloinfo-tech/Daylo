<body>
<div id="root"></div>
<script>
const appName='Flowday';
/* ===== FIREBASE =====
   Accounts (login, register), the user database and tasks now live in Firebase. Paste your web app config from
   Firebase console > Project settings > General > Your apps. These values are public identifiers, not secrets:
   what protects the data is firestore.rules. With the placeholders left in, the site runs the offline demo. */
window.FIREBASE_CONFIG={apiKey:'YOUR_FIREBASE_API_KEY',authDomain:'YOUR_FIREBASE_PROJECT_ID.firebaseapp.com',projectId:'YOUR_FIREBASE_PROJECT_ID',appId:'YOUR_FIREBASE_APP_ID'};
/* ===== n8n WEBHOOKS =====
   Only the AI and Google parts stay in n8n. Paste the Production URL of each webhook. URLs live only in this script and
   are never shown on the site. Every webhook needs Options > Allowed Origins (CORS) set to your site's origin.
   Every call sends the user's Firebase ID token as "Authorization: Bearer <token>"; the workflows verify it and use the
   verified uid, so the browser can never choose whose data it touches.
   assistant              POST { message }                      -> { reply }
   googleCalendarConnect  POST {}                               -> { url }   (the site opens that URL in a popup)
   googleCalendarAction   POST { action: list_events|create_event|update_event|delete_event, event, event_id, timeMin, timeMax } -> { ok, data }
   insights               POST { action:'get', timezone }       -> { sample_size, hours:{labels,counts}, peak_window, estimate_bias, on_time_rate, misses, confidence, suggestions }
   contactForm            POST { name, email, subject, message, created_at, user_id } -> { ok:true, message }
   plan  (AI planner, replaces the built-in auto-planner). One URL, switch on "action":
     action 'plan' | 'replan' | 'reschedule'
       POST { action, now, timezone, prefs:{ work_hours, peak_window, avoid_after, estimate_multiplier },
              tasks:[{ id, title, kind, project, deadline, duration_minutes, priority(1-3), importance(1-5), urgency(0-100), status,
                       missed_count, scheduled_start, scheduled_end, google_event_id }],
              calendar_events:[{ summary, start, end }], exclude?, after? }
       -> { plan:[{ task_id, start, end, reason }] }   (also accepted: { recommendation:{ recommendedTaskId, suggestedStart, suggestedEnd, reason } })
     The site saves confirmed slots to Firestore itself. The assistant workflow also calls this URL with apply:true and
     source:'assistant'; in that case the planner saves the slots (Firestore fields scheduled_start, scheduled_end, google_event_id). */
const N8N_WEBHOOKS = {
  assistant: 'YOUR_N8N_WEBHOOK_ASSISTANT',
  googleCalendarConnect: 'YOUR_N8N_WEBHOOK_GOOGLE_CALENDAR_CONNECT',
  googleCalendarAction: 'YOUR_N8N_WEBHOOK_GOOGLE_CALENDAR_ACTION',
  plan: 'YOUR_N8N_WEBHOOK_PLAN',
  insights: 'YOUR_N8N_WEBHOOK_INSIGHTS',
  contactForm: 'YOUR_N8N_WEBHOOK_CONTACT_FORM'
};
const N8N_METHODS = {assistant:'POST',googleCalendarConnect:'POST',googleCalendarAction:'POST',plan:'POST',insights:'POST',contactForm:'POST'};
const EP = {assistant:'assistant',connect:'googleCalendarConnect',calendar:'googleCalendarAction',plan:'plan',insights:'insights',contactForm:'contactForm'};
const mem={},LS={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let user=null,tasks=[],P={peak:true,bias:true,eve:true},page='home',sel=0,q='',fp='all',sortBy='score',gcal=false,GB=[],chat=[],nid=1;
const fbOn=()=>!!(window.FB&&window.FB.ok);
const live=()=>fbOn();
const remote=()=>live()&&user&&!!user.uid;
async function api(k,{body,query}={}){
 if(!live() && k!=='contactForm')return{ok:false,demo:true};
 const key=EP[k]||k,url=N8N_WEBHOOKS[key],method=N8N_METHODS[key]||'POST';
 if(!url||url.startsWith('YOUR_N8N_'))return{ok:false,error:'Webhook placeholder not configured: '+key};
 let target=url;if(query)target+=(target.includes('?')?'&':'?')+new URLSearchParams(query);
 let tok='';try{tok=await window.FB.auth.currentUser.getIdToken()}catch(e){}
 try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);
  const h={Authorization:'Bearer '+tok};if(method==='POST')h['Content-Type']='application/json';
  const r=await fetch(target,{method,headers:h,body:method==='POST'?JSON.stringify(body||{}):undefined,signal:c.signal});clearTimeout(tm);
  const t=await r.text();let d=t;try{d=JSON.parse(t)}catch(_){}return{ok:r.ok,data:d,status:r.status}}
 catch(err){return{ok:false,error:String(err)}}}

/* ===== AI planner (plan webhook) ===== */
const conf=k=>{const u=N8N_WEBHOOKS[EP[k]||k];return!!u&&!String(u).startsWith('YOUR_N8N_')};
const usePlan=()=>remote()&&conf('plan');
let autoPlanned=false;

function planBody(action,list,extra){return{action,founder_id:user.uid,userId:user.uid,now:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
 prefs:{work_hours:'09:00-18:00',peak_window:P.peak?String(P.pk[0]).padStart(2,'0')+':00-'+String(P.pk[1]).padStart(2,'0')+':00':null,avoid_after:P.eve?'18:00':null,estimate_multiplier:P.bias?(P.mult||1):1},
 tasks:list.map(t=>({id:t.id,title:t.title,kind:t.kind,project:t.project,deadline:t.due,duration_minutes:Math.round(t.dur*60),priority:t.prio,importance:[0,2,3,5][t.prio],urgency:score(t),status:t.status,missed_count:t.miss||0,scheduled_start:t.slot?slotISO(t.slot).start_iso:null,scheduled_end:t.slot?slotISO(t.slot).end_iso:null,google_event_id:t.eid||null})),
 calendar_events:GB.map(gbISO),...(extra||{})}}
function parsePlan(r){const d=r&&r.ok&&r.data;if(!d||typeof d!=='object')return[];const o=d.data&&typeof d.data==='object'?d.data:d;let a=o.plan||o.schedule||o.slots;
 if(!Array.isArray(a)&&o.recommendation&&o.recommendation.recommendedTaskId)a=[{task_id:o.recommendation.recommendedTaskId,start:o.recommendation.suggestedStart,end:o.recommendation.suggestedEnd,reason:o.recommendation.reason||o.recommendation.summary}];
 return(Array.isArray(a)?a:[]).map(x=>{const s=new Date(x.start||x.suggestedStart||x.scheduled_start),e=new Date(x.end||x.suggestedEnd||x.scheduled_end);if(isNaN(s)||isNaN(e)||e<=s)return null;
  return{id:x.task_id||x.taskId||x.id||x.recommendedTaskId,k:dk(s),s:s.getHours()+s.getMinutes()/60,len:(e-s)/36e5,reason:x.reason||o.summary||'Suggested by your AI planner'}}).filter(x=>x&&x.id!=null)}

/* ===== time, calendar and urgency ===== */
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const DAYS=(()=>{const a=[],d=new Date();d.setHours(0,0,0,0);while(a.length<7){if(d.getDay()%6)a.push(new Date(d));d.setDate(d.getDate()+1)}return a})();
const dIdx=k=>DAYS.findIndex(d=>dk(d)===k);
const isToday=i=>dk(DAYS[i])===dk(new Date());
const slDay=k=>{const[y,m,d]=k.split('-'),dt=new Date(y,m-1,d);return dk(dt)===dk(new Date())?'Today':dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const f=h=>{const x=Math.floor(h);return(x>12?x-12:x)+':'+(h%1?'30':'00')};
const sl=p=>slDay(p.k)+' '+f(p.s)+'–'+f(p.s+p.len);
const at=(off,h)=>{const d=new Date();d.setDate(d.getDate()+off);d.setHours(h,0,0,0);return d};
const nowH=()=>{const n=new Date();return n.getHours()+n.getMinutes()/60};
const MEET={1:[['Team sync',14,15]],2:[['Weekly sync',14,15]],3:[['Co-founder 1:1',15,16]],4:[['Design review',10,11]],5:[['Demo rehearsal',14,16]]};
const meets=i=>gcal?GB.filter(g=>g.k===dk(DAYS[i])).map(g=>[g.t,g.s,g.e]):(MEET[DAYS[i].getDay()]||[]);
const adj=t=>P.bias?Math.ceil(t.dur*(P.mult||1.5)*2)/2:t.dur;
const inPk=x=>x>=P.pk[0]&&x<P.pk[1];
const pkLabel=()=>{const h=x=>x>12?x-12:x,a=P.pk[0],b=P.pk[1];return h(a)+'–'+h(b)+(b<=12?' AM':a>=12?' PM':'')};
const dl=t=>Math.max((new Date(t.due)-new Date())/864e5,.5);
const parts=t=>{const d=dl(t),D=Math.min(1,Math.max(0,1-(d-.5)/14)),I=(t.prio-1)/2,E=Math.min(1,adj(t)/(d*2)+.4*(t.miss||0));return{D:Math.round(40*D),I:Math.round(30*I),E:Math.round(30*E)}};
const score=t=>{const p=parts(t);return p.D+p.I+p.E};
const dueTxt=t=>'Due '+new Date(t.due).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const pub=t=>({id:t.id,title:t.title,kind:t.kind,project:t.project,due:t.due,duration_hours:t.dur,priority:t.prio,status:t.status,urgency:score(t),slot:t.slot?slotISO(t.slot):null});
function slotISO(s){const[y,m,d]=s.k.split('-'),a=new Date(y,m-1,d,0,0).getTime();return{start_iso:new Date(a+s.s*36e5).toISOString(),end_iso:new Date(a+(s.s+s.len)*36e5).toISOString()}}
function busy(i,skip){const k=dk(DAYS[i]),b=[[12.5,13.5]];meets(i).forEach(m=>b.push([m[1],m[2]]));tasks.forEach(t=>{if(t.slot&&t.slot.k===k&&t.id!==skip)b.push([t.slot.s,t.slot.s+t.slot.len])});return b}
const lastDay=t=>{const due=new Date(t.due);let l=-1;DAYS.forEach((d,i)=>{if(d<=due)l=i});return l<0?1:l};
function findSlot(t,after){
 const len=adj(t),end=P.eve?18:20,last=lastDay(t);
 for(let i=0;i<=last;i++){const b=busy(i,t.id),c=[];let st=9;if(isToday(i))st=Math.max(9,Math.ceil((nowH()+.5)*2)/2);
  for(let s=st;s+len<=end;s+=.5){if(after&&(i<after.i||(i===after.i&&s<=after.s)))continue;if(b.some(x=>s<x[1]&&s+len>x[0]))continue;c.push(s)}
  if(P.peak&&t.prio>=2)c.sort((a,z)=>(inPk(a)?0:1)-(inPk(z)?0:1));
  if(c.length)return{k:dk(DAYS[i]),s:c[0],len}}
 return null}
function why(t,p){const r=[P.peak&&t.prio>=2&&inPk(p.s)?'Inside your '+pkLabel()+' peak window':'First free slot','before the deadline'];if(P.bias&&p.len!==t.dur)r.push('padded to '+p.len+'h (you said '+t.dur+'h)');if(P.eve)r.push('nothing after 6 PM');return r.join(', ')}
const mkProp=t=>{const p=findSlot(t);return p?{...p,reason:why(t,p),src:'demo'}:null};

function seed(){tasks=[];nid=1;
 [['Finish homepage wireframes','task','Website redesign',1,1.5,3],['Reply to client feedback','commitment','Client work',1,.5,3],['Prepare portfolio case study','task','Personal',2,1,2],['Research competitor apps','task','Product research',3,.75,2],['Update social media graphics','task','Marketing',9,1,1]]
  .forEach(a=>tasks.push({id:nid++,title:a[0],kind:a[1],project:a[2],due:at(a[3],17).toISOString(),dur:a[4],prio:a[5],status:'open',slot:null,miss:0}));
 tasks.push({id:nid++,title:'Send project update to client',kind:'commitment',project:'Client work',due:at(2,17).toISOString(),dur:.5,prio:2,status:'missed',slot:null,miss:1,was:'Yesterday 9:00'});
 tasks.filter(t=>t.status==='open').sort((a,b)=>score(b)-score(a)).forEach(t=>t.slot=findSlot(t))}
function autoMiss(){tasks.forEach(t=>{if(t.status==='open'&&t.slot){const[y,m,d]=t.slot.k.split('-');if(new Date(y,m-1,d).getTime()+(t.slot.s+t.slot.len)*36e5<Date.now()){recordMiss(t);t.was=sl(t.slot);t.slot=null;t.status='missed';if(!remote())t.miss=(t.miss||0)+1}}});tasks.forEach(t=>{if(t.status==='missed'&&!usePlan())t.proposal=mkProp(t)})}
function normalizeUser(u){
 u=(u&&typeof u==='object')?u:{};
 u.name=String(u.name||u.email?.split('@')[0]||'User').trim()||'User';
 u.email=String(u.email||'guest').trim().toLowerCase()||'guest';
 return u;
}
function normalizePrefs(p,remoteMode){
 const base=remoteMode?{peak:false,bias:false,eve:true,mult:1,pk:[9,11]}:{peak:true,bias:true,eve:true,mult:1.5,pk:[9,11]};
 p=(p&&typeof p==='object')?p:{};
 const out={...base,...p};
 out.peak=!!out.peak;out.bias=!!out.bias;out.eve=!!out.eve;
 out.mult=Number.isFinite(Number(out.mult))&&Number(out.mult)>0?Number(out.mult):base.mult;
 if(!Array.isArray(out.pk)||out.pk.length<2||!Number.isFinite(Number(out.pk[0]))||!Number.isFinite(Number(out.pk[1]))||Number(out.pk[1])<=Number(out.pk[0]))out.pk=[9,11];
 else out.pk=[Number(out.pk[0]),Number(out.pk[1])];
 return out;
}
function enter(u){
 user=normalizeUser(u);gcal=false;GB=[];P=normalizePrefs(null,remote());INS=null;INSERR=false;insApplied=false;

 if(!ok){if(remote())tasks=[];else seed()}
 if(!Array.isArray(tasks))tasks=[];
 P=normalizePrefs(P,remote());
 nid=tasks.reduce((m,t)=>Math.max(m,+t.id||0),0)+1;autoMiss();save();sel=0;chat=[];page='dashboard';render();scrollTo(0,0);if(remote()){loadCalendar().then(syncTasks);loadInsights(true)}}

async function sha(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s+':'+p)))}}

function shell(){return`<div class="shell"><aside class="sidebar"><div class="side-logo"><div class="logo"><div class="logo-mark">✦</div><span class="brand-name">${appName}</span></div></div>${NAVS.slice(0,5).map(n=>`<button class="nav-item ${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} <span>${n[2]}</span></button>`).join('')}<div class="side-bottom"><button class="nav-item ${page==='settings'?'active':''}" onclick="go('settings')">⚙ <span>Settings</span></button><button class="user-chip ${page==='profile'?'active':''}" onclick="go('profile')" aria-label="Open your profile" title="View profile"><div class="avatar">${esc(String(user?.name||user?.email||'U').charAt(0).toUpperCase())}</div><div class="user-info"><b style="font-size:13px">${esc(user.name)}</b><div class="tiny muted">Free workspace</div></div></button></div></aside><main class="main"><header class="topbar"><div class="top-title">${NAVS.find(n=>n[0]===page)[2]}</div><div class="top-right"><button class="btn small" onclick="go('profile')">Profile</button><button class="btn small" onclick="quickAdd()">＋ Add task</button><button class="btn small" onclick="logout()">Log out</button></div></header><div class="content">${({dashboard,tasks:tasksPage,calendar:calendarPage,assistant:assistantPage,learning:learningPage,profile:profilePage,contact:contactPage,settings:settingsPage}[page]||dashboard)()}</div></main></div>`}
function render(){if(page==='home')return landing();if(page==='login'||page==='register')return auth(page);if(!user){page='login';return auth('login')}root.innerHTML=shell()}

function taskRow(t){const c=parts(t),d=t.status==='done';return`<div class="task ${d?'done':''}"><button class="check ${d?'done':''}" onclick="toggleTask('${t.id}')" aria-label="Toggle ${esc(t.title)}"></button><div class="task-body"><div class="task-name">${esc(t.title)}</div><div class="task-meta"><span class="pill">${esc(t.project)}</span><span class="pill ${t.prio==3?'high':t.prio==2?'medium':''}">${['','Low','Medium','High'][t.prio]}</span><span class="pill">${dueTxt(t)}</span><span class="pill">${t.slot?sl(t.slot):t.status==='missed'?'Needs rescheduling':'Not scheduled'}</span></div></div><div style="text-align:right" title="Deadline ${c.D}/40, importance ${c.I}/30, effort and risk ${c.E}/30"><div class="score">${score(t)}</div><div class="tiny muted">urgency</div></div></div>`}
function ribbon(i){const k=dk(DAYS[i]),pc=h=>(h-8)/11*100,b=[`<div class="rb" style="left:${pc(12.5)}%;width:${pc(13.5)-pc(12.5)}%"></div>`];
 meets(i).forEach(m=>b.push(`<div class="rb" title="${m[0]}" style="left:${pc(m[1])}%;width:${pc(m[2])-pc(m[1])}%"></div>`));
 tasks.forEach(t=>{if(t.slot&&t.slot.k===k)b.push(`<div class="rb t" title="${esc(t.title)}" style="left:${pc(t.slot.s)}%;width:${t.slot.len/11*100}%"></div>`);const p=t.proposal;if(t.status==='missed'&&p&&p.k===k)b.push(`<div class="rb g" title="Proposed: ${esc(t.title)}" style="left:${pc(p.s)}%;width:${p.len/11*100}%"></div>`)});
 if(isToday(i)&&nowH()>=8&&nowH()<=19)b.push(`<div class="now" style="left:${pc(nowH())}%"></div>`);
 return`<div class="ribbon">${b.join('')}</div><div class="ticks"><span>8</span><span>10</span><span>12</span><span>2</span><span>4</span><span>6</span><span>7 PM</span></div><div class="legend"><span><i style="background:var(--brand)"></i>Planned by ${appName}</span><span><i style="background:#dfe1e8"></i>Meetings and lunch</span><span><i style="border:1.5px dashed var(--brand)"></i>Proposed</span></div>`}
function missCard(t){const p=t.proposal;return`<div class="card miss" style="margin-bottom:12px"><div class="task-name">${esc(t.title)}</div><div class="task-meta"><span class="pill high">Missed, was ${esc(t.was||'earlier')}</span><span class="pill">${esc(t.project)}</span><span class="pill">${dueTxt(t)}</span></div><div class="prop">${p?`<div class="tiny muted">Proposed new time</div><b style="font-size:17px">${sl(p)}</b><p class="tiny muted">${esc(p.reason)}.</p><button class="btn primary small" onclick="approve('${t.id}')">Approve move</button> <button class="btn small" onclick="another('${t.id}')">Another time</button>`:(t.pending?'<b>Finding a new time…</b>':'<b>No free slot before the deadline</b><p class="tiny muted">Free up time or move the deadline.</p>')}</div></div>`}
function dashboard(){
 const open=tasks.filter(t=>t.status==='open'),miss=tasks.filter(t=>t.status==='missed'),k0=dk(DAYS[0]),td=open.filter(t=>t.slot&&t.slot.k===k0),mins=Math.round(td.reduce((a,t)=>a+t.slot.len,0)*60),
  top=open.slice().sort((a,b)=>score(b)-score(a)),h=new Date().getHours(),g=h<12?'morning':h<18?'afternoon':'evening',t0=top[0];
 return`<div class="page-head"><div><h1>Good ${g}, ${esc(user.name.split(' ')[0])}</h1><p>Your schedule adapts around what matters most.</p></div><button class="btn primary" onclick="go('assistant')">✦ Ask Ashley</button></div>
<div class="grid stats"><div class="card"><span class="muted tiny">${isToday(0)?'Planned today':'Next working day'}</span><div class="stat-num">${td.length}</div><span class="tiny">${Math.floor(mins/60)}h ${mins%60}m of work</span></div><div class="card"><span class="muted tiny">Open tasks</span><div class="stat-num">${open.length}</div><span class="tiny">${miss.length} need rescheduling</span></div><div class="card"><span class="muted tiny">Completed</span><div class="stat-num">${tasks.filter(t=>t.status==='done').length}</div><span class="tiny">of ${tasks.length} tasks</span></div><div class="card"><span class="muted tiny">Avg urgency</span><div class="stat-num">${Math.round(top.reduce((a,t)=>a+score(t),0)/Math.max(top.length,1))}</div><span class="tiny">across open tasks</span></div></div>
<div style="height:16px"></div><div class="card"><div class="section-title"><h2>${isToday(0)?'Your day':'Next working day'}</h2><button class="btn small" onclick="go('calendar')">Open calendar</button></div>${ribbon(0)}</div>
${miss.length?`<div class="section-title" style="margin:22px 0 12px"><h2>Needs your OK <span class="pill high">${miss.length}</span></h2></div>${miss.map(missCard).join('')}`:''}
<div style="height:16px"></div><div class="grid two"><div class="card"><div class="section-title"><h2>Priorities</h2><button class="btn small" onclick="go('tasks')">View all</button></div>${top.slice(0,4).map(taskRow).join('')||'<p class="muted">Nothing open. Add a task to get started.</p>'}</div>
<div class="card"><div class="section-title"><h2>AI recommendation</h2><span>✦</span></div>${t0?`<div class="insight"><b>Start with “${esc(t0.title)}”</b><p>Urgency ${score(t0)}. ${t0.slot?'Planned for '+sl(t0.slot)+'. '+esc(why(t0,t0.slot))+'.':'Not scheduled yet.'}</p></div>`:''}<div class="insight"><b>${P.peak?'Your '+pkLabel()+' window is protected':'Peak-window planning is off'}</b><p>${P.peak?'Important work is placed where you finish the most tasks.':'Turn it back on in How I Work.'}</p></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="planAll()">✦ Plan unscheduled tasks</button>${live()?'':'<button class="btn" style="width:100%;margin-top:8px" onclick="simMiss()">Simulate a missed task</button>'}</div></div>`}
function listHTML(){const a=tasks.filter(t=>(fp==='all'||['','Low','Medium','High'][t.prio]===fp)&&t.title.toLowerCase().includes(q.toLowerCase())),none='<p class="muted">No tasks match.</p>';
 if(sortBy==='due')return a.sort((x,y)=>new Date(x.due)-new Date(y.due)).map(taskRow).join('')||none;
 const G=[['Due soon',t=>t.status!=='done'&&score(t)>=60],['Coming up',t=>t.status!=='done'&&score(t)>=30&&score(t)<60],['No rush',t=>t.status!=='done'&&score(t)<30],['Done',t=>t.status==='done']];
 return G.map(([n,fn])=>{const r=a.filter(fn).sort((x,y)=>score(y)-score(x));return r.length?`<div class="section-title" style="margin-top:14px"><h2>${n} <span class="pill">${r.length}</span></h2></div>${r.map(taskRow).join('')}`:''}).join('')||none}
const refreshList=()=>{$('#taskList').innerHTML=listHTML()};
function tasksPage(){const t0=tasks.filter(t=>t.status!=='done').sort((a,b)=>score(b)-score(a))[0],c=t0&&parts(t0);
 return`<div class="page-head"><div><h1>My Tasks</h1><p>Every task is scored so you can see what deserves attention first.</p></div><button class="btn primary" onclick="quickAdd()">＋ New task</button></div><div class="filterbar"><input class="search" oninput="q=this.value;refreshList()" placeholder="Search tasks..." value="${esc(q)}"><select onchange="fp=this.value;refreshList()">${['all','High','Medium','Low'].map(x=>`<option ${fp===x?'selected':''} value="${x}">${x==='all'?'All priorities':x}</option>`).join('')}</select><button class="btn small" onclick="sortBy='score';refreshList()">Highest urgency</button><button class="btn small" onclick="sortBy='due';refreshList()">Deadline</button></div><div class="card" id="taskList">${listHTML()}</div><div style="height:16px"></div>
<div class="card"><div class="section-title"><h2>How urgency is calculated</h2><span class="pill">Transparent AI</span></div><div class="grid three"><div class="insight"><b>Deadline proximity · 40%</b><p>Closer deadlines raise urgency.${c?' Top task: '+c.D+'/40.':''}</p></div><div class="insight"><b>Importance · 30%</b><p>Your chosen priority influences the score.${c?' Top task: '+c.I+'/30.':''}</p></div><div class="insight"><b>Effort + risk · 30%</b><p>Long or repeatedly missed tasks get more attention.${c?' Top task: '+c.E+'/30.':''}</p></div></div></div>`}
function calendarPage(){const H=48,k=dk(DAYS[sel]),ev=[`<div class="ev" style="top:${4.5*H}px;height:${H-2}px">Lunch</div>`];let ln='';
 meets(sel).forEach(m=>ev.push(`<div class="ev" style="top:${(m[1]-8)*H}px;height:${(m[2]-m[1])*H-2}px">${m[0]}<small>${f(m[1])}–${f(m[2])}</small></div>`));
 tasks.forEach(t=>{if(t.slot&&t.slot.k===k)ev.push(`<div class="ev t ${t.status==='done'?'d':''}" style="top:${(t.slot.s-8)*H}px;height:${t.slot.len*H-2}px">${esc(t.title)}<small>${f(t.slot.s)}–${f(t.slot.s+t.slot.len)}</small></div>`);const p=t.proposal;if(t.status==='missed'&&p&&p.k===k)ev.push(`<div class="ev g" style="top:${(p.s-8)*H}px;height:${p.len*H-2}px">Proposed: ${esc(t.title)}<small>Approve on Overview</small></div>`)});
 for(let h=8;h<=19;h++)ln+=`<div class="hl" style="top:${(h-8)*H}px"><span>${f(h)}</span></div>`;
 const nl=isToday(sel)&&nowH()>=8&&nowH()<=19?`<div class="nowl" style="top:${(nowH()-8)*H}px"></div>`:'';
 return`<div class="page-head"><div><h1>Your week</h1><p>Tasks and calendar commitments in one schedule.${gcal?' Showing your Google Calendar.':' Meetings shown are samples.'}</p></div><div class="cal-actions">${gcal?'<span class="status">● Google Calendar connected</span>':'<button class="btn" onclick="connectGoogle()">◉ Connect Google Calendar</button>'}<button class="btn primary" onclick="quickAdd()">＋ Add task</button></div></div>
<div class="days">${DAYS.map((d,i)=>`<button class="dc" aria-pressed="${i===sel}" onclick="sel=${i};render()">${d.toLocaleDateString('en-US',{weekday:'short'})}<b>${d.getDate()}</b></button>`).join('')}</div><div class="card"><div class="tlw"><div class="tl">${ln}${ev.join('')}${nl}</div></div></div><div style="height:16px"></div>
<div class="grid two"><div class="card"><div class="section-title"><h2>Smart rescheduling</h2><span class="pill">AI enabled</span></div><p class="muted tiny" style="line-height:1.6">Miss a slot and ${appName} proposes a new one. It only moves after you approve.</p>${live()?'<button class="btn primary" onclick="replanAll()">Re-plan my week</button>':'<button class="btn primary" onclick="simMiss()">Simulate a schedule change</button>'}</div><div class="card"><div class="section-title"><h2>Google Calendar</h2></div><p class="muted tiny">Connect your calendar to plan around real meetings, or open a prefilled event for your top task.</p><button class="btn" onclick="exportTask()">Add top task to Google Calendar</button></div></div>`}
function assistantPage(){return`<div class="page-head"><div><h1>AI Assistant</h1><p>Talk to Ashley about your schedule instead of managing every detail.</p></div></div><div class="grid two"><div class="chat"><div class="messages" id="messages"><div class="msg ai"><b>Hi ${esc(user.name.split(' ')[0])}</b><br>I'm Ashley. Ask what to work on next, or tell me what changed and I'll propose a new plan.</div>${chat.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join('')}<div class="suggestions"><button class="suggest" onclick="suggestAsk('What should I work on next?')">What should I work on next?</button><button class="suggest" onclick="suggestAsk('Move my client feedback reply')">Move my client reply</button><button class="suggest" onclick="suggestAsk('Plan my day')">Plan my day</button></div></div><div class="chat-input"><input id="chatInput" onkeydown="if(event.key==='Enter')sendChat()" placeholder="Tell Ashley what changed..."><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="card"><div class="section-title"><h2>Assistant actions</h2></div><div class="insight"><b>Prioritize</b><p>“What is my most urgent task?”</p></div><div class="insight"><b>Reschedule</b><p>“Move my client reply.”</p></div><div class="insight"><b>Plan</b><p>“Plan my day.”</p></div>${remote()?'<p class="tiny muted">Ashley can also save tasks you describe, like “Follow up with legal by Friday”.</p>':''}</div></div>`}
function demoLearning(){const R=[['peak','Schedule important work between 9 and 11 AM','You finish the most tasks in this window.'],['bias','Add 50% to your time estimates','Tasks take about 1.5x longer than you plan.'],['eve','Keep evenings free','You skipped 4 of 5 slots after 7 PM.']];
 return`<div class="page-head"><div><h1>How I Work</h1><p>${appName} learns patterns from your planning and execution history.</p></div><span class="pill">Simulated history</span></div><div class="grid two"><div class="card"><div class="section-title"><h2>Tasks completed by time of day</h2></div>${bars()}<p style="margin:12px 0 18px">Peak focus: <b>9 to 11 AM</b></p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="insight"><b>Estimate bias</b><p style="font-size:22px;font-weight:850;color:var(--ink)">${P.bias?'1.5x':'Off'}</p></div><div class="insight"><b>Completion rate</b><p style="font-size:22px;font-weight:850;color:var(--ink)">78%</p></div></div><div class="learning" style="margin-top:8px"><div class="ring"></div><div><b>74% confidence</b><p class="tiny muted">Enough history to make useful suggestions.</p></div></div></div>
<div class="card"><div class="section-title"><h2>What ${appName} applies now</h2></div><p class="muted tiny">Turn a rule off and watch your plan change on Overview and Calendar.</p>${R.map(r=>`<div class="li"><div><b style="font-size:14px">${r[1]}</b><div class="tiny muted">${r[2]}</div></div><button class="sw" role="switch" aria-checked="${P[r[0]]}" aria-label="${r[1]}" onclick="rule('${r[0]}')"></button></div>`).join('')}<div class="insight" style="margin-top:14px"><b>Privacy principle</b><p>A production version should show exactly what is collected and let users delete their history.</p></div></div></div>`}
let INS=null,INSERR=false,insApplied=false;
async function loadInsights(silent){if(!remote()||!conf('insights'))return;
 const r=await api('insights',{body:{action:'get',founder_id:user.uid,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone}}),d=r.ok&&r.data&&r.data.success!==false&&r.data.hours?r.data:null;
 INSERR=!d;if(d)INS=d;
 if(d&&!insApplied){insApplied=true;if(d.sample_size>=5){const sg=d.suggestions||{};if(sg.peak_window){P.pk=[sg.peak_window.start,sg.peak_window.end];P.peak=true}if(sg.estimate_multiplier){P.mult=sg.estimate_multiplier;P.bias=true}}}
 if(!silent||page==='learning')render()}
const hr12=x=>(x>12?x-12:x)+(x>=12?' PM':' AM');
function realBars(h){const m=Math.max(1,...h.counts),w=INS.peak_window;return`<div class="bars">${h.counts.map((v,i)=>{const st=7+2*i;return`<div class="${w&&st>=w.start&&st<w.end?'pk':''}" style="height:${Math.max(4,v/m*100)}%" title="${v} tasks"></div>`}).join('')}</div><div class="bl">${h.labels.map(x=>`<span>${x}</span>`).join('')}</div>`}
function learningPage(){
 if(!(remote()&&conf('insights')))return demoLearning();
 const head=`<div class="page-head"><div><h1>How I Work</h1><p>${appName} learns from the tasks you complete and the slots you miss.</p></div><span class="pill">${INS?'Live data':'Loading'}</span></div>`;
 if(!INS)return head+`<div class="card"><p class="muted">${INSERR?'Could not load your patterns. <button class="btn small" onclick="loadInsights()">Try again</button>':'Loading your patterns…'}</p></div>`;
 const n=INS.sample_size,pc=v=>v==null?'n/a':Math.round(v*100)+'%';
 if(n<5)return head+`<div class="card"><div class="section-title"><h2>Not enough data yet</h2><span class="pill">${n} of 5</span></div><p class="muted" style="line-height:1.6">Complete ${5-n} more task${5-n===1?'':'s'} and ${appName} will show when you work best. When you mark a task done, tell it how long it took so it can learn your real estimates.</p></div>`;
 const sg=INS.suggestions||{},w=INS.peak_window,inW=w?INS.hours.counts.reduce((a,c,i)=>{const st=7+2*i;return a+(st>=w.start&&st<w.end?c:0)},0):0,R=[];
 if(sg.peak_window)R.push(['peak','Schedule important work between '+hr12(w.start)+' and '+hr12(w.end),'You finished '+inW+' of '+n+' tasks in this window.']);
 if(sg.estimate_multiplier)R.push(['bias','Plan for '+sg.estimate_multiplier+'x your time estimates','Across '+INS.estimate_samples+' timed tasks, the real time was about '+sg.estimate_multiplier+'x your estimate.']);
 if(sg.avoid_evenings)R.push(['eve','Keep evenings free',INS.misses.evening+' of '+INS.misses.total+' missed slots were after 6 PM.']);
 return head+`<div class="grid two"><div class="card"><div class="section-title"><h2>Tasks completed by time of day</h2></div>${realBars(INS.hours)}<p style="margin:12px 0 18px">Peak focus: <b>${w?hr12(w.start)+' to '+hr12(w.end):'no clear peak yet'}</b></p>
 <div class="grid" style="grid-template-columns:1fr 1fr"><div class="insight"><b>Estimate bias</b><p style="font-size:22px;font-weight:850;color:var(--ink)">${INS.estimate_bias?INS.estimate_bias+'x':'n/a'}</p><p class="tiny muted">${INS.estimate_bias?INS.estimate_samples+' timed tasks':INS.estimate_samples+' of 3 timed tasks needed'}</p></div><div class="insight"><b>Finished on time</b><p style="font-size:22px;font-weight:850;color:var(--ink)">${pc(INS.on_time_rate)}</p><p class="tiny muted">${pc(INS.first_try_rate)} done without a missed slot</p></div></div>
 <div class="insight" style="margin-top:8px"><b>${pc(INS.confidence)} confidence</b><p class="tiny muted">Based on ${n} completed tasks and ${INS.misses.total} missed slot${INS.misses.total===1?'':'s'}.</p></div></div>
 <div class="card"><div class="section-title"><h2>What ${appName} applies now</h2></div>${R.length?R.map(r=>`<div class="li"><div><b style="font-size:14px">${r[1]}</b><div class="tiny muted">${r[2]}</div></div><button class="sw" role="switch" aria-checked="${P[r[0]]}" aria-label="${r[1]}" onclick="rule('${r[0]}')"></button></div>`).join(''):'<p class="muted tiny">No pattern is strong enough to act on yet. Keep completing tasks.</p>'}<p class="tiny muted" style="margin-top:12px">Turn a rule off to stop it shaping your plan.</p></div></div>`}

function initials(name){
 const x=String(name||'User').trim().split(/\s+/).filter(Boolean);
 return (x.length>1?x[0][0]+x[x.length-1][0]:x[0]?.[0]||'U').toUpperCase();
}
async function saveProfile(){
 const input=$('#profileName');
 if(!input)return;
 const name=input.value.trim();
 if(!name)return toast('Please enter your name.');
 if(name.length>80)return toast('Name is too long.');
 const old=user.name;
 user.name=name;
 if(remote()){
  try{
   const F=window.FB;
   await F.updateProfile(F.auth.currentUser,{displayName:name});
   await F.setDoc(F.doc(F.db,'users',user.uid),{name,email:user.email,updated_at:new Date().toISOString()},{merge:true});
  }catch(e){
   user.name=old;
   return toast('Could not save your profile. Please try again.');
  }
 }
 LS.set('flowday_session',JSON.stringify(user));
 render();
 toast('Profile updated ✓');
}

async function submitContact(e){
 e.preventDefault();
 const name=$('#contactName').value.trim(),email=$('#contactEmail').value.trim().toLowerCase(),subject=$('#contactSubject').value.trim(),message=$('#contactMessage').value.trim();
 if(!name||!email||!subject||!message)return toast('Please complete all fields.');
 if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email address.');
 const btn=e.target.querySelector('button[type=submit]');
 btn.disabled=true;
 const payload={name,email,subject,message,created_at:new Date().toISOString(),user_id:user?.uid||null};
 // If the contact-form webhook is configured, send the form to n8n.
 // Otherwise preserve the existing Firebase/local-demo behavior.
 if(conf('contactForm')){

async function toggleTask(id){const t=tasks.find(x=>x.id==id);if(!t)return;
 if(remote()){if(t.status==='done')return toast('Completed tasks stay completed.');
  const mins=await askActual(t);
  try{const F=window.FB,u={status:'done',completed_at:new Date().toISOString()};if(mins!=null)u.actual_minutes=mins;await F.updateDoc(F.doc(F.db,'tasks',String(t.id)),u)}
  catch(e){return toast('Could not mark the task done. Please try again.')}
  t.actual=mins;loadInsights(true)}
 t.status=t.status==='done'?'open':'done';save();render();toast(t.status==='done'?'Task completed ✓':'Task reopened')}
function askActual(t){return new Promise(res=>{const m=document.createElement('div');m.className='modal-bg';
 m.innerHTML=`<div class="modal"><div class="modal-head"><h2>How long did it take?</h2><button class="x" data-v="skip" aria-label="Skip">✕</button></div><p class="muted tiny">${esc(t.title)}. This teaches ${appName} how long your work really takes.</p><div class="task-meta">${[[15,'15 min'],[30,'30 min'],[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[180,'3+ hours']].map(a=>`<button class="btn" data-v="${a[0]}">${a[1]}</button>`).join(' ')}</div><button class="btn ghost" data-v="skip" style="margin-top:12px">Skip</button></div>`;
 m.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;m.remove();res(b.dataset.v==='skip'?null:+b.dataset.v)};document.body.appendChild(m)})}
async function recordMiss(t){if(!remote()||!t.slot)return;const F=window.FB,s=slotISO(t.slot);try{await F.addDoc(F.collection(F.db,'misses'),{uid:user.uid,task_id:String(t.id),slot_start:s.start_iso,slot_hour:new Date(s.start_iso).getHours(),created_at:new Date().toISOString()});await F.updateDoc(F.doc(F.db,'tasks',String(t.id)),{status:'missed',missed_count:F.increment(1),missed_slot:s.start_iso,scheduled_start:null,scheduled_end:null})}catch(e){}}
async function syncSlot(t){if(!remote()||!gcal||!t.slot)return;const s=slotISO(t.slot),body={founder_id:user.uid,action:t.eid?'update_event':'create_event',event:{summary:t.title,description:'Flowday scheduled task',start:{dateTime:s.start_iso},end:{dateTime:s.end_iso}}};if(t.eid)body.event_id=t.eid;const r=await api('calendar',{body}),ev=r.ok&&r.data&&r.data.data;if(ev&&ev.id){t.eid=ev.id;save()}}
function approve(id){const t=tasks.find(x=>x.id==id),p=t.proposal;t.slot={k:p.k,s:p.s,len:p.len};t.status='open';delete t.proposal;save();render();toast('Moved to '+sl(t.slot));confirmSlot(t,p.reason)}
async function another(id){const t=tasks.find(x=>x.id==id);if(!t||!t.proposal)return;
 if(usePlan()){const cur=slotISO(t.proposal),old=t.proposal;t.pending=true;render();const it=parsePlan(await api('plan',{body:planBody('reschedule',[t],{exclude:[cur],after:cur.start_iso})})),x=it.find(i=>i.id==t.id)||it[0];t.pending=false;
  if(x)t.proposal={k:x.k,s:x.s,len:x.len,reason:x.reason,src:'plan'};else{t.proposal=old;toast('The planner has no other time to suggest.')}render();return}
 const n=findSlot(t,{i:dIdx(t.proposal.k),s:t.proposal.s});if(n){t.proposal={...n,reason:why(t,n),src:'demo'};render()}else toast('No later slot before the deadline.')}
function missTask(t){t.was=t.slot?sl(t.slot):'earlier';t.slot=null;t.status='missed';t.miss=(t.miss||0)+1;t.proposal=mkProp(t);save();render()}
function simMiss(){const c=tasks.filter(t=>t.status==='open'&&t.slot).sort((a,b)=>slotISO(a.slot).start_iso.localeCompare(slotISO(b.slot).start_iso))[0];if(!c)return toast('No scheduled task left to miss.');missTask(c);toast('Marked as missed. A new time was proposed.')}
async function planAll(){const u=tasks.filter(t=>t.status==='open'&&!t.slot);if(!u.length)return toast('Everything is already planned.');
 if(usePlan())return planTasks(u);

function rule(k){P[k]=!P[k];if(usePlan()){render();return toast('Saved. Your next plan will use this preference.')}tasks.filter(t=>t.status==='missed').forEach(t=>t.proposal=mkProp(t));save();render();toast('Plan recalculated with your new rules.')}

 const r=await api('calendar',{body:{founder_id:user.uid,action:'list_events',timeMin:a.toISOString(),timeMax:new Date(a.getTime()+8*864e5).toISOString()}}),it=r.ok&&r.data&&r.data.data&&r.data.data.items;
 if(!Array.isArray(it)){gcal=false;return false}

async function syncTasks(){if(!remote())return;const F=window.FB;let rows;
 try{const q=await F.getDocs(F.query(F.collection(F.db,'tasks'),F.where('uid','==',user.uid)));rows=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return toast('Could not load your tasks.')}
 const old=tasks,out=[];
 rows.forEach(x=>{const o=old.find(t=>t.id==x.id),d=x.due_date?new Date(x.due_date):null,st=x.status==='done'?'done':x.status==='missed'?'missed':'open',
   t=o||{id:x.id,miss:0,status:st,dur:+x.duration_hours||(+x.duration_minutes/60)||1,prio:+x.priority||2,slot:null};
  if(st==='done')t.status='done';
  Object.assign(t,{title:x.content,kind:x.category||'task',project:x.linked_person||'Inbox',miss:+x.missed_count||0,due:(!d||isNaN(d)?at(3,17):d).toISOString()});
  const ss=new Date(x.scheduled_start||''),se=new Date(x.scheduled_end||'');if(!isNaN(ss)&&!isNaN(se)&&se>ss&&t.status!=='missed')t.slot={k:dk(ss),s:ss.getHours()+ss.getMinutes()/60,len:(se-ss)/36e5};
  if(x.google_event_id)t.eid=x.google_event_id;
  if(st==='missed'&&!t.was){const ms=new Date(x.missed_slot||'');t.was=isNaN(ms)?'earlier':slDay(dk(ms))+' '+f(ms.getHours()+ms.getMinutes()/60)}
  out.push(t)});
 old.filter(t=>t.status==='done'&&!out.some(x=>x.id==t.id)).forEach(t=>out.push(t));tasks=out;
 autoMiss();const un=tasks.filter(t=>t.status==='open'&&!t.slot);
 if(usePlan()){render();proposeMissing();if(un.length&&!autoPlanned){autoPlanned=true;planTasks(un)}}
 else{un.sort((a,b)=>score(b)-score(a)).forEach(t=>{t.slot=findSlot(t);if(t.slot)confirmSlot(t)});save();render()}}
async function pushTask(t){if(!remote())return null;const F=window.FB;try{const r=await F.addDoc(F.collection(F.db,'tasks'),{uid:user.uid,content:t.title,linked_person:t.project==='Inbox'?'':t.project,due_date:t.due,category:t.kind,duration_hours:t.dur,priority:t.prio,status:'open',missed_count:0,created_at:new Date().toISOString()});return r.id}catch(e){return null}}
function exportTask(){const t=tasks.filter(x=>x.status==='open'&&x.slot).sort((a,b)=>score(b)-score(a))[0];if(!t)return toast('Plan a task first.');const s=slotISO(t.slot),fm=d=>d.replace(/[-:]/g,'').replace(/\.\d{3}/,'');window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+fm(s.start_iso)+'/'+fm(s.end_iso)+'&details='+encodeURIComponent('Planned by '+appName),'_blank')}

/* add task: plain English -> intake webhook (or built-in parser) */
function parseLocal(text){const l=text.toLowerCase();let title=text.split(/\s*(?:,|\bdue\b|\bby\b|\bneeds?\b|\burgent\b|\basap\b|\btomorrow\b|\btoday\b)/i)[0].trim()||text.trim();title=title[0].toUpperCase()+title.slice(1);
 let off=3,m;const wd=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
 if(/\btoday\b/.test(l))off=0;else if(/\btomorrow\b/.test(l))off=1;else if(/next week/.test(l))off=7;else wd.forEach((n,i)=>{if(l.includes(n))off=(i-new Date().getDay()+7)%7||7});
 let dur=1;if(m=l.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)\b/))dur=+m[1];else if(m=l.match(/(\d+)\s*(?:m|mins?|minutes)\b/))dur=Math.max(.5,Math.round(m[1]/30)/2);
 return{text,title,due:at(off,17),dur,prio:/urgent|asap|important|critical|high/.test(l)?3:/\blow\b|whenever|someday/.test(l)?1:2,kind:/send|follow up|reply|promised|commit/.test(l)?'commitment':'task'}}
const intake=async text=>({...parseLocal(text),src:'demo'});

  if(usePlan())planTasks([t]);else{t.slot=findSlot(t);render();confirmSlot(t)}return}

function localReply(x){const l=x.toLowerCase(),o=tasks.filter(t=>t.status==='open').sort((a,b)=>score(b)-score(a)),m=o.find(t=>t.title.toLowerCase().split(' ').some(w=>w.length>4&&l.includes(w)));

 if(/plan|day|afternoon/.test(l)){const p=o.filter(t=>t.slot).sort((a,b)=>slotISO(a.slot).start_iso.localeCompare(slotISO(b.slot).start_iso)).slice(0,3);return p.length?'Coming up: '+p.map(t=>`<b>${esc(t.title)}</b> (${sl(t.slot)})`).join(', ')+'.':'Nothing is planned yet. Try “Plan unscheduled tasks” on Overview.'}
